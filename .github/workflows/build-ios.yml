name: build-ios

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # 判断 iOS 上能不能直接用系统自带的 libarchive（支持 rar / 7z / tar / xz / bz2）。
      # 只要能 dlopen 到，就不用把 unrar / 7zip 的源码塞进工程。
      - name: Probe system archives
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          echo "--- SDK usr/lib ---"
          ls -la "$SDK/usr/lib" 2>/dev/null | head -60
          echo "--- archive / lzma / bz2 / xz stubs ---"
          ls "$SDK/usr/lib" 2>/dev/null | grep -iE "archive|lzma|bz2|xz" || echo "(none in SDK usr/lib)"

      # 真跑一遍 LibArchive：在 runner 的 macOS 上 dlopen 系统 libarchive，用工程里同一份
      # Swift 代码解 tar / tar.gz。跑通了说明 dlsym 的名字、函数签名、解包流程都对；
      # 只验证 iOS 侧编译是看不出来这些的。失败不影响出包，日志里能看到。
      - name: Archive reader self-test
        continue-on-error: true
        run: |
          mkdir -p /tmp/arc/src/chap
          for i in 1 2 3; do printf '0123456789AB' > /tmp/arc/src/chap/$i.jpg; done
          printf 'not an image' > /tmp/arc/src/notes.txt
          (cd /tmp/arc && tar cf comic.tar src && tar czf comic.tar.gz src)
          cat > /tmp/arc/main.swift <<'SWIFT'
          import Foundation

          let archive = LibArchive.shared
          print("libarchive available:", archive.isAvailable)
          for path in CommandLine.arguments.dropFirst() {
              let url = URL(fileURLWithPath: path)
              let entries = archive.list(url)
              let images = entries.filter { PageFiles.isImage($0.name) }
              print(url.lastPathComponent, "entries:", entries.count, "images:", images.count)
              print("  names:", entries.map { $0.name })
              if let first = images.first {
                  let data = archive.readEntry(url, named: first.name)
                  print("  first page bytes:", data?.count ?? -1, "(expect 12)")
              }
              let out = URL(fileURLWithPath: "/tmp/arc/out_" + url.lastPathComponent)
              try? FileManager.default.createDirectory(at: out, withIntermediateDirectories: true)
              let extracted = archive.extractImages(url, to: out)
              print("  extracted:", extracted, "(expect 3)")
          }
          SWIFT
          swiftc -O -o /tmp/arc/selftest \
            EnhanceComic/Model/Models.swift \
            EnhanceComic/Data/BookSession.swift \
            EnhanceComic/Data/ZipReader.swift \
            EnhanceComic/Data/Inflate.swift \
            EnhanceComic/Data/LibArchive.swift \
            /tmp/arc/main.swift 2>&1 | tail -25
          /tmp/arc/selftest /tmp/arc/comic.tar /tmp/arc/comic.tar.gz

      - name: Build unsigned device binary
        run: |
          set -o pipefail
          xcodebuild \
            -project EnhanceComic.xcodeproj \
            -scheme EnhanceComic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Inject file sharing key
        run: |
          APP=build/Build/Products/Release-iphoneos/EnhanceComic.app
          PLIST="$APP/Info.plist"
          # Xcode 的 INFOPLIST_KEY_ 白名单里没有 UIFileSharingEnabled（pbxproj 里写了也会被丢掉），
          # 而「文件」App 里要看到 App 的文件夹必须有这个键，所以在打包前直接补进去。
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          # ProMotion：没有这个键，iPhone 会把整个 App 的刷新率锁在 60Hz（iPad 默认不锁），
          # 滚动和翻页动画看着就是"卡卡的、刷新率不对"。它同样不在 INFOPLIST_KEY_ 白名单里。
          /usr/libexec/PlistBuddy -c "Delete :CADisableMinimumFrameDurationOnPhone" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST"
          echo "--- verify ---"
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$PLIST"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EnhanceComic.app Payload/
          zip -qry EnhanceComic-unsigned.ipa Payload
          ls -lh EnhanceComic-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnhanceComic-unsigned-ipa
          path: EnhanceComic-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
